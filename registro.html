
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requisitos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado"><center>

        <h1>Registros</h1>
        <p>Ingresa tus datos escolares.</p>
    </header>

    <main class="contenedor">
        <form class="panel formulario"
              onsubmit="alert('Formulario validado. Para enviar y guardar los datos necesitas conectarlo a un servidor.'); return false;">
<center> 
            <h2>Datos del alumno</h2>

            <label for="alumno">Número de alumno</label>
            <input
                type="text"
                id="alumno"
                name="alumno"
                placeholder="10 dígitos"
                inputmode="numeric"
                pattern="[0-9]{10}"
                maxlength="10"
                minlength="10"
                title="Ingresa exactamente 10 dígitos"
                required>

            <p></p><br><label for="nombre">Nombre completo</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre"
                required>

            <p></p><br><label for="grupo">Grupo</label>
            <input
                type="text"
                id="grupo"
                name="grupo"
                placeholder="Ej. A"
                required>

            <p></p><br><label for="grado">Grado</label>
            <input
                type="number"
                id="grado"
                name="grado"
                placeholder="Ej. 3"
                min="1"
                required>

            <p></p><br><button type="submit" class="boton">
                Enviar
            </button>
</center>
          

        </form>
    </main>
</center>
</body>
</html>
